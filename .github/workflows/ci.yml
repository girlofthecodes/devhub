# CI: lint, tests, build and image scanning on every push and pull request.
# Runs with read-only permissions and no secrets, so untrusted pull requests (forks) can run
# it safely; nothing here deploys.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devhub
          POSTGRES_USER: devhub
          POSTGRES_PASSWORD: devhub_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devhub" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: devhub
      POSTGRES_USER: devhub
      POSTGRES_PASSWORD: devhub_ci_only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt pip-audit
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: OpenAPI schema
        run: DJANGO_SECRET_KEY=ci python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yaml --settings=config.settings.test
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements/base.txt

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  scripts:
    name: Scripts and compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x scripts/*.sh backend/docker/entrypoint.sh infrastructure/vpn/*.sh
      - name: Compose files are valid
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config --quiet
          DEVHUB_ENV_FILE=infrastructure/compose/server-a.env.example \
            docker compose -f infrastructure/compose/server-a.compose.yaml \
            --env-file infrastructure/compose/server-a.env.example config --quiet
          docker compose -f infrastructure/compose/server-b.compose.yaml \
            --env-file infrastructure/compose/server-b.env.example config --quiet

  images:
    name: Build and scan images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.app }} (prod target)
        run: docker build --target prod -t devhub-${{ matrix.app }}:ci ${{ matrix.app }}
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: devhub-${{ matrix.app }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
